server.port=${PORT:8080}

# Spring Application
spring.application.name=bengaluru-guide-backend

# Database Configuration (Default embedded H2 for zero-configuration startup, with PostgreSQL ready)
spring.datasource.url=jdbc:h2:mem:bengalurudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging / inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# External Maps & Routing API Integration (Keys read from Environment Variables)
app.maps.google-api-key=${GOOGLE_MAPS_API_KEY:}
app.maps.osrm-routing-url=https://router.project-osrm.org
app.maps.nominatim-url=https://nominatim.openstreetmap.org

# Logging
logging.level.com.bengaluru.guide=INFO
logging.level.org.springframework.web=INFO
